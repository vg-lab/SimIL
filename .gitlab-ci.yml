stages: [run]

.default-before-script: &default-before-script
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt install -y git doxygen g++ cmake ninja-build libboost-all-dev libhdf5-dev libglm-dev qtbase5-dev

include:
  - component: $CI_SERVER_FQDN/common/ci-shared/cmake-workflow@main
    inputs:
      job_prefix: debug
      image: "docker.io/ubuntu:24.04"
      before_script: *default-before-script
      workflow_preset: "debug-test"
      build_dir: "build/debug"

  - component: $CI_SERVER_FQDN/common/ci-shared/cmake-workflow@main
    inputs:
      job_prefix: debug-extra
      image: "docker.io/ubuntu:24.04"
      before_script: *default-before-script
      workflow_preset: "debug-extra-test"
      build_dir: "build/debug-extra"

  - component: $CI_SERVER_FQDN/common/ci-shared/cmake-workflow@main
    inputs:
      job_prefix: debug-unstable
      image: "docker.io/debian:unstable"
      before_script: *default-before-script
      workflow_preset: "debug-test"
      build_dir: "build/debug"

  - component: $CI_SERVER_FQDN/common/ci-shared/cmake-workflow@main
    inputs:
      job_prefix: debug-extra-unstable
      image: "docker.io/debian:unstable"
      before_script: *default-before-script
      workflow_preset: "debug-extra-test"
      build_dir: "build/debug-extra"
